<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı | Masterface</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=4">
<script src="/assets/js/theme.js"></script>
<style>
.nf{min-height:100vh;display:flex;flex-direction:column}
.nf main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,5vw,80px) 96px}
.nf .code{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(96px,22vw,260px);line-height:.9;letter-spacing:-.04em;color:var(--accent);margin:0 0 8px}
.nf h1{font-size:clamp(30px,4.5vw,56px);letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
.nf p{color:var(--muted);max-width:520px;margin:0 0 32px}
.nf .actions{display:flex;flex-wrap:wrap;gap:16px}
</style>
</head>
<body>
<div class="nf">
  <header class="site">
    <a href="/"><img src="/assets/logo.svg" alt="Masterface"></a>
  </header>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Aradığınız sayfayı bulamadık.</h1>
    <p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir. Ana sayfaya dönüp oradan devam edebilir ya da bize doğrudan ulaşabilirsiniz.</p>
    <div class="actions">
      <a href="/" class="cta-light">Ana sayfaya dön</a>
      <a href="/#iletisim" class="cta-outline">Teklif İste</a>
    </div>
  </main>
</div>
</body>
</html>
